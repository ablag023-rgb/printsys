services:
  # ============ Хранилища документов (симуляция двух систем-источников) ============
  s3-billing:                 # «Биллинг/РЦ» — справки о расчётах, якоря дел
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_BILLING_KEY:-billing_key}
      MINIO_ROOT_PASSWORD: ${S3_BILLING_SECRET:-billing_secret_123}
    ports: ["9101:9000", "9191:9001"]
    volumes: [s3_billing:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-docflow:                 # «Юр. документооборот» — выписки, платёжки, прочее
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_DOCFLOW_KEY:-docflow_key}
      MINIO_ROOT_PASSWORD: ${S3_DOCFLOW_SECRET:-docflow_secret_123}
    ports: ["9102:9000", "9192:9001"]
    volumes: [s3_docflow:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:                    # одноразовое создание бакетов, идемпотентно
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      s3-billing: {condition: service_healthy}
      s3-docflow: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set billing http://s3-billing:9000 ${S3_BILLING_KEY:-billing_key} ${S3_BILLING_SECRET:-billing_secret_123};
      mc alias set docflow http://s3-docflow:9000 ${S3_DOCFLOW_KEY:-docflow_key} ${S3_DOCFLOW_SECRET:-docflow_secret_123};
      mc mb --ignore-existing billing/ksr-spravki;
      mc mb --ignore-existing docflow/ksr-dokumenty;
      mc anonymous set none billing/ksr-spravki;
      mc anonymous set none docflow/ksr-dokumenty;
      echo 'buckets ready';
      "
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printsys
      POSTGRES_PASSWORD: printsys
      POSTGRES_DB: printsys
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printsys"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      S3_BILLING_ENDPOINT: http://s3-billing:9000
      S3_DOCFLOW_ENDPOINT: http://s3-docflow:9000
      PG_DSN: postgresql+asyncpg://printsys:printsys@db:5432/printsys
      DATA_ROOTS: /data
      SCAN_INTERVAL_MINUTES: "${SCAN_INTERVAL_MINUTES:-10}"
      SECRET_KEY: "${SECRET_KEY:-printsys-dev-key-change-me}"
    # Нужно, чтобы приложение могло само подключать сетевую шару,
    # указанную в настройках. Без этого доступен только режим bind-mount.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      # Демо-папка для локальной разработки (read-only):
      - ../Документы:/data/demo:ro
      # Writeable volume для папок, загруженных через UI:
      - uploads:/data/uploads
      # Точки монтирования шар, подключённых из настроек:
      - mounts:/data/mounts
      # Сетевая шара. Раскомментируйте и задайте переменные в .env — см. volumes ниже.
      # - ksr_share:/data/share:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-include='*.py' --reload-include='*.html'"

volumes:
  pgdata:
  uploads:
  mounts:
  s3_billing:
  s3_docflow:

  # Сетевая шара через CIFS-драйвер Docker: монтирование объявлено здесь,
  # привилегированный контейнер не нужен. Учётные данные — в .env (в git не попадает).
  # Раскомментируйте вместе со строкой ksr_share в web.volumes.
  #
  # ksr_share:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: "//${SMB_HOST:?SMB_HOST not set}/${SMB_SHARE:?SMB_SHARE not set}"
  #     o: "username=${SMB_USER},password=${SMB_PASSWORD},domain=${SMB_DOMAIN:-},ro,uid=0,gid=0,iocharset=utf8,vers=3.0,noserverino"
