services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printsys
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD not set}
      POSTGRES_DB: printsys
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printsys"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql+asyncpg://printsys:${PG_PASSWORD:?PG_PASSWORD not set}@db:5432/printsys
      DATA_ROOTS: ${DATA_ROOTS:-/data}
      SCAN_INTERVAL_MINUTES: "${SCAN_INTERVAL_MINUTES:-10}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY not set}"
    # Требуется, если шара задаётся в настройках приложения.
    # Если шара монтируется на хосте (вариант А) — эти строки можно убрать.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      # ВАРИАНТ А (рекомендуется): шара смонтирована на хосте (autofs/systemd/fstab),
      # сюда прокидывается bind-mount. Хост сам занимается переподключением.
      - ${HOST_DATA_DIR:-./mount}:/data/share:ro
      # Writeable volume для папок, загруженных через UI:
      - uploads:/data/uploads
      - mounts:/data/mounts
      # ВАРИАНТ Б: монтирование средствами Docker — раскомментируйте вместе
      # с томом ksr_share ниже, и уберите bind-mount выше.
      # - ksr_share:/data/share:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

volumes:
  pgdata:
  uploads:
  mounts:

  # ВАРИАНТ Б — монтирование шары средствами Docker (CIFS-драйвер).
  # Учётные данные в .env, привилегированный контейнер не нужен.
  # ksr_share:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: "//${SMB_HOST:?SMB_HOST not set}/${SMB_SHARE:?SMB_SHARE not set}"
  #     o: "username=${SMB_USER},password=${SMB_PASSWORD},domain=${SMB_DOMAIN:-},ro,uid=0,gid=0,iocharset=utf8,vers=3.0,noserverino"
